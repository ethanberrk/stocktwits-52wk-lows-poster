# .github/workflows/tick.yml
name: tick
on:
  # Ticks are driven solely by cron-job.org, which POSTs a workflow_dispatch
  # on the :15/:45 slots, 13:00-21:45 UTC weekdays (13 in-market ticks,
  # offset from the highs poster's :00/:30 and the weakness poster's
  # :05/:35 so the three don't fire together). run.py gates market hours
  # precisely. The cron-job.org job is created at Phase 1 go-live, so there
  # is no jobId here yet.
  #
  # GitHub's own `schedule` cron is deliberately not used: on the sibling
  # highs poster it delivered only ~27% of its slots on time (7-56 min
  # late), and a late fire landing in a different half-hour window than the
  # dispatch posted an extra ticker, compressing the 30-min trickle and
  # exhausting the daily cap early.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tick (Phase 1 preview — dry-run, no token in this repo)
        env:
          # Launch caps: 1 post/tick (a 30-min trickle that dodges the
          # Stocktwits duplicate filter), 12/day. Repo defaults are 2/20.
          MAX_PER_TICK: "1"
          MAX_PER_DAY: "12"
          PYTHONUNBUFFERED: "1"
        run: python run.py --sync-state
      - name: Commit state + output
        # always(): if the tick crashed mid-posting, the pending/confirmed
        # state on disk must still be persisted so nothing double-posts.
        # Branch guard: a manual dispatch on a feature branch must never push
        # its state to main.
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "52wk-lows-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state output
          if git diff --cached --quiet; then
            echo "nothing posted this tick"; exit 0
          fi
          git commit -m "state: tick $(date -u +'%Y-%m-%dT%H:%M')"
          git pull --rebase origin main
          git push
